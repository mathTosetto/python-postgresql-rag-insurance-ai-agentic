services:

  db:
    image: pgvector/pgvector:pg18
    restart: always
    shm_size: 128mb
    env_file:
      - path: ./.env
        required: true
    ports:
      - 5432:5432
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/data:/data:ro
      - pgdata:/var/lib/postgresql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  pgdata: