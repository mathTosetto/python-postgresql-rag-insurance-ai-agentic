services:

  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: insurance
    ports:
      - 5432:5432
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/data:/data:ro
      - pgdata:/var/lib/postgresql  # 18+ layout: data lives in a versioned subdirectory

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  pgdata: