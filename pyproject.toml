[project]
name = "python-postgresql-rag-insurance-ai-agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faker>=40.54.0",
    "uv>=0.13.8",
]

[dependency-groups]
test = [
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs the running database from docker compose (skipped when unreachable)",
]
